[package]
authors = ["Clover You <hi@clovu.me>"]
description = "A Visual Studio Code extension to delete functions in Rust code."
edition = "2024"
license-file = "../LICENSE"
name = "rust"
repository = "https://github.com/clovu/vscode-delete-function"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.122"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["extra-traits", "full"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.72"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
